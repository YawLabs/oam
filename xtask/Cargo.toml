[package]
name = "xtask"
description = "Repo automation: V8 bump bot, snapshot rebuilds, release packaging."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }

# bench mcp-idle-rss reads a child process's RSS by PID. Windows uses
# tasklist, linux reads /proc; sysinfo backs the remaining unix targets
# (macOS) where /proc is absent. Same crate the engine os natives use.
# Target-scoped to match the #[cfg] on its only use (xtask/src/bench.rs):
# declared unconditionally, cargo 1.100's warn-by-default
# cargo::unused_dependencies fires on every Windows and linux build.
[target.'cfg(not(any(target_os = "windows", target_os = "linux")))'.dependencies]
sysinfo = { workspace = true }

[lints.clippy]
# xtask is the gate's own tooling and carries no unsafe today; these keep it
# that way honestly rather than by assumption.
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
missing_safety_doc = "deny"
