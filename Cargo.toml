[workspace]
resolver = "2"
members = [
    "crates/oam_engine",
    "crates/oam_core",
    "crates/oam_diagnostics",
    "crates/oam_loader",
    "crates/oam_ts",
    "crates/oam_mcp",
    "crates/oam_cli",
    "crates/oam_napi_test_addon",
    "crates/oam_aliasing_model",
    "xtask",
]
# vendor/ holds patched copies of third-party crates, wired in by
# [patch.crates-io] at the bottom of this file. They are path dependencies,
# NOT members: without the exclude, cargo would adopt a path dependency that
# sits under the workspace root as a member, and `--workspace` clippy and test
# would run over upstream code (and its dev-dependencies).
exclude = ["vendor"]

[workspace.package]
version = "0.16.2"
# Internal crates: oam ships BINARIES, nothing here goes to crates.io.
# Also lets `cargo about` filter them out of THIRD_PARTY_LICENSES.md.
publish = false
edition = "2024"
license = "Apache-2.0"
authors = ["Jeff <jeff@rad.fyi>"]

[workspace.dependencies]
# Engine: rusty_v8 — semver-stable V8 bindings, prebuilt static libs
# (incl. aarch64-pc-windows-msvc, verified present in v150.0.0 assets).
v8 = "150"

anyhow = "1"
thiserror = "2"
# io-util: AsyncReadExt/AsyncWriteExt for the streaming file ops.
# net/sync/macros: the HTTP server (TcpListener, channels, select!).
tokio = { version = "1", features = ["rt-multi-thread", "time", "fs", "io-util", "io-std", "net", "sync", "macros", "process", "signal"] }
# reqwest is oam_loader's `oam install` client only: `fetch` and
# `http.request` left it in #143 for oam's own transport (oam_core
# http_client), which decodes response bodies itself. It stays in the build,
# and in process.versions, because the installer links it.
# rustls-no-provider + explicit ring: reqwest's default rustls provider is
# aws-lc-rs, whose C build (aws-lc-sys) fails under MSVC on ARM64. ring
# compiles clean on every tier-1 target (same choice Deno ships).
# "stream" (Body::wrap_stream) and "gzip"/"deflate" (async-compression over
# flate2) were chosen for the fetch op, which no longer uses reqwest. The
# install client never streams a request body; the features stay only
# because dropping one changes the dependency graph, a change of its own.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "stream", "gzip", "deflate"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: serde_json::Map keeps insertion order (IndexMap) instead of
# sorting keys (BTreeMap). Load-bearing for the loader: package.json
# `exports` / `imports` condition objects and tsconfig `paths` are matched in
# DECLARATION order by Node and tsc -- a sorted map made `default` beat
# `import` / `require` / `node` in every dual package. Nothing in the
# workspace relied on the sorted order (install.rs sorts explicitly where it
# needs determinism).
serde_json = { version = "1", features = ["preserve_order"] }
# WHATWG URL parsing — ada is the same C++ parser Node.js ships (3-4x
# faster than servo url on parse benchmarks). Rust FFI bindings.
ada-url = "3"
# node:crypto wave 1: RustCrypto streaming digests + HMAC (pure Rust,
# builds on every tier-1 target) and OS randomness.
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
getrandom = "0.3"
# node:crypto wave 2: symmetric ciphers (AES-CBC/CTR/GCM) and key
# derivation (pbkdf2/scrypt/hkdf). All digest-0.10 / cipher-0.4 family.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
ctr = "0.9"
aes-gcm = "0.10"
cipher = "0.4"
# Triple-DES, for TLS server keys and PKCS#12 bundles protected with it
# (tls/keys.rs): DES-EDE3-CBC legacy PEM keys, PBES2 des-ede3-cbc, PKCS#12's
# pbeWithSHAAnd3-/2-KeyTripleDES-CBC. RustCrypto, cipher-0.4 family like aes
# (0.9 moved to cipher 0.5, which would duplicate the family).
des = "0.8"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
scrypt = { version = "0.11", default-features = false }
hkdf = "0.12"
# node:crypto wave 3: asymmetric sign/verify (RSA, ECDSA, Ed25519).
# ring is already compiled as a transitive dep via rustls; promoting it
# to a direct dep adds zero new compilation units.
ring = "0.17"
base64 = "0.22"
# node:crypto wave 4: RSA encrypt/decrypt (publicEncrypt, privateDecrypt).
# ring deliberately omits RSA encryption; the rsa crate (pure Rust) fills
# the gap. rand_core provides OsRng for the encrypt padding randomness.
rsa = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }
# node:crypto wave 5: ECDH key agreement (createECDH).
# ring's ECDH is one-shot (consumes the key); p256/p384 hold persistent
# SecretKey objects that support Node's multi-computeSecret pattern.
p256 = { version = "0.13", features = ["ecdh"] }
p384 = { version = "0.13", features = ["ecdh"] }
# node:crypto wave 6: classic Diffie-Hellman (createDiffieHellman,
# getDiffieHellman).  Already in-tree transitively via rsa -> num-bigint-dig;
# promoting to direct dep adds zero new compilation units.
num-bigint-dig = { version = "0.8", features = ["prime"] }
# node:crypto wave 7: X.509 certificate inspection (X509Certificate class).
# nom is already in-tree transitively; x509-parser adds only the ASN.1
# layer (der-parser, asn1-rs, oid-registry) — no C deps.
x509-parser = "0.16"
# node:zlib: gzip/deflate via the same backend everything else in the
# Rust ecosystem uses (already in-tree transitively through oxc).
flate2 = "1"
# npm tarball extraction.
tar = "0.4"
# node:zlib brotli backend -- pure-Rust, default features only (std + alloc-stdlib).
# No native deps, no ffi-api, no simd -- builds on every tier-1 target.
brotli = { version = "8", default-features = false, features = ["std"] }
# HTTP server, and since #143 the fetch client (oam_core adds the client
# features in its own manifest): hyper + adapters. reqwest, the install
# client, builds the same versions, so declaring them adds no new
# compilation units.
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
# The upgrade path of the http server reads request heads itself and parses
# them with the parser hyper uses (already in the graph through hyper).
httparse = "1"
# oam's own fetch transport (crates/oam_core/src/http_client, #143): request
# URLs, the http types and userinfo decoding. All three already compile in the
# graph (url and percent-encoding via reqwest, http via hyper); declaring them
# adds edges, not packages. `url` must stay ONE version in Cargo.lock:
# process.versions.url is read from it (oam_engine/build.rs).
url = "2"
http = "1"
percent-encoding = "2"
# fetch's `br` response decoding (http_client/decode.rs) drives the decoder
# stream directly for bounded output. Already compiled: brotli (node:zlib)
# depends on it with the same features.
brotli-decompressor = { version = "5", default-features = false, features = ["std"] }
# fetch's gzip/deflate response decoding drives miniz_oxide's core inflate
# directly, holding the window itself so a copy from before the start of the
# output fails as zlib's does (flate2's wrapper keeps a wrapping dictionary
# that cannot tell). Already compiled: it IS flate2's rust_backend, and
# flate2 enables with-alloc + simd on it, so no feature changes either.
miniz_oxide = { version = "0.8", default-features = false }
# oam's fetch transport (http_client/{connector,transport,send}.rs, #143 slice
# C). All three already compile in the graph through oam_loader's reqwest
# (the install client), with these features: new dependency EDGES, no new
# packages. h2 is named only to classify a retryable stream error (hyper does
# not re-export it); tower-service is the connector's `Service<Uri>`;
# rustls-platform-verifier is the trust store fetch has always used.
h2 = "0.4"
tower-service = "0.3"
rustls-platform-verifier = "0.7"
# TLS client/server: tokio-rustls wraps rustls for async IO; webpki-roots
# bundles Mozilla's CA store for public HTTPS; rustls-pemfile parses PEM.
# All three are already compiled transitively via tokio-tungstenite --
# promoting to direct deps adds zero new compilation units.
tokio-rustls = { version = "0.26", default-features = false }
webpki-roots = "0.26"
rustls-pemfile = "2"
# DNS record-type resolution (MX, TXT, CNAME, NS, SRV, SOA, PTR, etc.)
# and reverse lookups. tokio-runtime for async; system-config reads
# the OS resolver settings.
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
# V8 Inspector (CDP) transport: WebSocket framing for the debugger socket.
# default-features=false drops the TLS backends — the inspector is
# plaintext localhost only.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# N-API: dlopen for .node addons (and the test addon's host-symbol lookup).
libloading = "0.8"
clap = { version = "4", features = ["derive"] }
# os/process native values on macOS + other non-linux unix: total/free mem,
# CPU model/speed, process RSS, parent PID. Windows uses FFI/registry and
# linux reads /proc directly; sysinfo backs only the remaining unix targets.
sysinfo = "0.39"

# TypeScript strip/transform pipeline (the wedge): pinned as a family —
# oxc crates must share one version.
oxc_allocator = "0.135"
oxc_ast = "0.135"
oxc_ast_visit = "0.135"
oxc_parser = "0.135"
oxc_span = "0.135"
oxc_semantic = "0.135"
oxc_transformer = "0.135"
oxc_codegen = "0.135"
oxc_diagnostics = "0.135"

# Internal crates
# default-features = false so a member CAN opt out of oam_engine's `napi`
# feature: Cargo rejects `default-features = false` on an inheriting member
# unless the workspace entry already says so. oam_cli (the only dependent)
# turns it back on through its own `napi` passthrough, which is `default`,
# so an ordinary `cargo build` is unchanged.
oam_engine = { path = "crates/oam_engine", default-features = false }
oam_core = { path = "crates/oam_core" }
oam_diagnostics = { path = "crates/oam_diagnostics" }
oam_loader = { path = "crates/oam_loader" }
oam_ts = { path = "crates/oam_ts" }
oam_mcp = { path = "crates/oam_mcp" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Fast iterative builds; release perf work (PGO/BOLT) comes with oam-bench.
[profile.dev.package."*"]
opt-level = 1

# ada-url vendors amalgamated C++ (deps/ada.cpp) whose helpers are marked
# __attribute__((always_inline)) (ada.h `ada_really_inline`). GCC 13 refuses
# always_inline at low opt (the "*" override above is only -O1, still too low
# for the indirect-call helper is_forbidden_host_code_point), failing the CI
# build. -O2 lets GCC inline it. 3.4.5 is the newest crate, so there is no
# version bump to fix this -- the fix is the C++ opt level.
[profile.dev.package.ada-url]
opt-level = 2

# hyper 1.10.1 with one fix oam cannot wait for: a request sent onto a pooled
# HTTP/1 or HTTP/2 connection at the instant its connection task ends could be
# stranded in hyper's dispatch channel, and its fetch then never settled.
# vendor/hyper-1.10.1/OAM-PATCH.md has the diff, the reproduction and the
# upstream status. Delete this entry, the exclude above and the vendor/ copy
# when a hyper release ships the fix.
[patch.crates-io]
hyper = { path = "vendor/hyper-1.10.1" }
