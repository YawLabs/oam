name: CI

# NOTE: the YawLabs org Actions policy is "selected" (GitHub-owned + verified
# + an explicit pattern allowlist). This workflow deliberately uses ONLY
# GitHub-owned actions (checkout, cache) — third-party actions like
# dtolnay/rust-toolchain or Swatinem/rust-cache fail the whole workflow at
# startup unless added to the org allowlist. rustup ships on all hosted
# runners and reads rust-toolchain.toml, so we don't need them.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust (per rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ matrix.target }}-cargo-
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Smoke (oam run)
        shell: bash
        run: |
          echo "console.log('ci smoke', 6 * 7)" > smoke.js
          out=$(./target/debug/oam run smoke.js)
          [ "$out" = "ci smoke 42" ] || { echo "unexpected: $out"; exit 1; }

  # ARM hosted runners (windows-11-arm, ubuntu-24.04-arm) are available on
  # PUBLIC repos only. Gated on visibility so both legs activate automatically
  # when the repo goes public. Until then the win-arm64 leg is covered daily
  # by local dev (the primary dev machine is windows-arm64).
  test-arm:
    if: ${{ !github.event.repository.private }}
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust (per rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ matrix.target }}-cargo-
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Smoke (oam run)
        shell: bash
        run: |
          echo "console.log('ci smoke', 6 * 7)" > smoke.js
          out=$(./target/debug/oam run smoke.js)
          [ "$out" = "ci smoke 42" ] || { echo "unexpected: $out"; exit 1; }

  unsafe-audit:
    name: unsafe budget (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Count unsafe blocks per crate
        shell: bash
        run: |
          # Advisory for now; becomes a ratchet gate with the SAFETY-comment
          # checker (AI-POLICY.md gate 5). oam_engine is the quarantined FFI
          # boundary and is reported separately.
          for crate in crates/*/; do
            n=$(grep -rn 'unsafe' "$crate/src" --include='*.rs' | wc -l || true)
            echo "$crate: $n unsafe mentions"
          done
