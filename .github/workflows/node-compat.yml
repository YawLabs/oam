name: node-compat

# Out-of-band Node test-suite harness (cargo run -p xtask -- node-suite): runs a
# vendored subset of Node's own test/ under oam, scoring exit-0 == pass. Kept off
# the per-PR critical path (it is far heavier than the unit suite) -- only a
# lightweight ubuntu RATCHET gate runs on PRs; the full 4-platform measurement
# runs daily + on demand.
#
# Org Actions policy is "selected" -> GitHub-owned actions only (checkout, cache,
# upload-artifact). rustup ships on hosted runners.

on:
  schedule:
    - cron: "0 7 * * *" # daily comprehensive measurement
  workflow_dispatch:
  pull_request:
    # Only when something that can move the number / the skip-ratchet changes.
    paths:
      - "conformance/vendor/node/**"
      - "xtask/src/node_suite.rs"
      - "js/**"
      - "crates/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  # Lightweight gate: enforces the skip-ratchet (node-suite exits non-zero if the
  # discretionary manifest skip count exceeds the committed ceiling). Test
  # pass-rate does NOT fail this job -- only a ratchet violation does.
  ratchet:
    name: skip-ratchet gate (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust (per rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: node-compat-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: node-compat-cargo-
      - name: Build oam
        run: cargo build -p oam_cli
      - name: Run node-suite (node ships on hosted runners)
        run: cargo run -p xtask -- node-suite
      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-suite-scorecard-ubuntu
          path: |
            conformance/node-suite-scorecard.json
            CONFORMANCE-NODE.md

  # Full per-platform measurement (advisory): the real >85% gate number, per OS.
  measure:
    name: ${{ matrix.target }}
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust (per rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-node-compat-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ matrix.target }}-node-compat-cargo-
      - name: Build oam
        run: cargo build -p oam_cli
      - name: Run node-suite
        run: cargo run -p xtask -- node-suite
      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-suite-scorecard-${{ matrix.target }}
          path: |
            conformance/node-suite-scorecard.json
            CONFORMANCE-NODE.md
