[package]
name = "oam_diagnostics"
description = "ODIF (oam Diagnostic Interchange Format): the one envelope for every diagnostic oam emits. JSON is the source of truth; pretty-printers are renderers."
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

[lints.clippy]
# The crate is `#![forbid(unsafe_code)]`, so the coverage lints are moot --
# but a stray `// Safety:` prose comment still trips this one, and did.
unnecessary_safety_comment = "deny"
