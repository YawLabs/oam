[package]
name = "oam_napi_test_addon"
description = "Test fixture: a real compiled N-API addon (.node) used by the e2e suite to prove the ABI path."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
libloading = { workspace = true }

[lints.clippy]
# Per-site `unsafe` coverage is compiler-enforced here (AI-POLICY gate 5),
# not counted: a `// SAFETY:` on every unsafe block/impl, a `/// # Safety`
# section on every public unsafe fn, and no stray SAFETY marker on a fn
# definition or foreign module (where clippy rightly rejects one).
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
missing_safety_doc = "deny"

[lints.cargo]
# A dependency no target of this crate uses fails the gate on every leg.
# `-D warnings` after `--` reaches rustc and clippy only; cargo's own lints
# are not rustc lints, so warn-by-default `unused_dependencies` (cargo 1.100)
# would otherwise only print. Per-package, not `[workspace.lints]`: every
# member has its own `[lints.clippy]`, which `lints.workspace = true` cannot
# be combined with. vendor/ crates are excluded from the workspace and keep
# their upstream manifests. Measured limits on 1.100: dev-dependencies are
# not checked, and a direct dependency that is also reachable through another
# dependency is not reported.
unused_dependencies = "deny"
