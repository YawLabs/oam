[package]
name = "oam_engine"
description = "rusty_v8 glue: isolate lifecycle, snapshots, code cache. The only crate allowed to expose rusty_v8 types."
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
v8 = { workspace = true }
anyhow = { workspace = true }
oam_diagnostics = { workspace = true }
oam_core = { workspace = true }
# CJS interop: require() resolution + module-kind classification (v8-free).
oam_loader = { workspace = true }
# Facade generation JSON-escapes paths/export names.
# serde Serialize/Deserialize derives used by replay.rs.
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# WHATWG URL parse/mutate natives for the JS URL class, and permission
# net-gate host extraction in ops.rs.
ada-url = { workspace = true }
# node:crypto natives: streaming digests, HMAC, OS randomness.
sha1 = { workspace = true }
sha2 = { workspace = true }
md-5 = { workspace = true }
hmac = { workspace = true }
getrandom = { workspace = true }
# node:crypto wave 2: symmetric ciphers + key derivation.
aes = { workspace = true }
cbc = { workspace = true }
ctr = { workspace = true }
aes-gcm = { workspace = true }
cipher = { workspace = true }
pbkdf2 = { workspace = true }
scrypt = { workspace = true }
hkdf = { workspace = true }
# node:crypto wave 3: asymmetric sign/verify.
ring = { workspace = true }
base64 = { workspace = true }
# node:crypto wave 4: RSA encrypt/decrypt.
rsa = { workspace = true }
rand_core = { workspace = true }
# node:crypto wave 5: ECDH key agreement.
p256 = { workspace = true }
p384 = { workspace = true }
# node:crypto wave 6: classic Diffie-Hellman.
num-bigint-dig = { workspace = true }
# node:crypto wave 7: X.509 certificate inspection.
x509-parser = { workspace = true }
# N-API addon loading.
libloading = { workspace = true }
# os/process native values on macOS + other non-linux unix (mem/cpu/rss/ppid).
sysinfo = { workspace = true }
# WebSocket ops: Message type for wsSend framing.
tokio-tungstenite = { workspace = true }

# Hardware SHA-256 on aarch64 (Apple Silicon et al.): enable sha2's built-in
# ARMv8 SHA2-extension backend (src/sha256/aarch64.rs), gated behind sha2's
# `asm` feature and runtime-detected via cpufeatures "sha2" (falls back to the
# soft backend when the CPU lacks FEAT_SHA256, so it stays correct everywhere).
#
# Scoped to non-Windows aarch64: the `asm` feature also compiles the sha2-asm
# crate, whose cc/assembler build step fails on aarch64-pc-windows-msvc
# (LNK1181 -- MSVC cannot link the GNU-as .o). macOS/Linux aarch64 assemble it
# fine. x86 is untouched -- it already uses runtime SHA-NI intrinsics without
# `asm`. Closes the ~6.8x createHash('sha256') gap vs node on mac-arm.
[target.'cfg(all(target_arch = "aarch64", not(target_os = "windows")))'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

# TTY raw-mode (termios: tcgetattr/cfmakeraw/tcsetattr) + window size
# (TIOCGWINSZ ioctl) backing process.stdin.setRawMode and stdout.columns/rows.
# Windows uses inline extern "system" console FFI (no crate). Same libc "0.2"
# that oam_core already depends on; cfg(unix) so the Windows build never pulls it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
# Snapshot generation evaluates js/bootstrap.js at build time (build.rs).
v8 = { workspace = true }
