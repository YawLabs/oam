[package]
name = "oam_cli"
description = "The oam binary."
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "oam"
path = "src/main.rs"

[features]
default = ["napi"]
# Passthrough for oam_engine's `napi` feature. It is a SEPARATE feature here
# because build.rs keys the exported ABI surface off CARGO_FEATURE_NAPI: a
# build.rs only ever sees its OWN package's features, never a dependency's.
# With it off, no `.def` / `--export-dynamic` link arg is emitted and the
# binary exports no `napi_*` symbol at all.
napi = ["oam_engine/napi"]
# The Windows pseudoconsole e2e (tests/e2e.rs, mod conpty). Off by default:
# the harness is real but unfinished -- it cannot yet hand the child a
# writable console input handle, so the raw-mode assertions are ignored.
# YawLabs/oam#109.
conpty-e2e = []

[dependencies]
# default-features = false so `--no-default-features` on THIS crate actually
# reaches oam_engine; the `napi` feature above turns it back on.
oam_engine = { workspace = true, default-features = false }
oam_diagnostics = { workspace = true }
oam_loader = { workspace = true }
oam_ts = { workspace = true }
oam_mcp = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Inspector e2e: a CDP-over-WebSocket client that attaches to the spawned
# `oam run --inspect-brk` process and drives the pause/resume handshake.
tokio = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["connect", "handshake"] }
futures-util = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }

# Unix pty e2e (tests/e2e.rs, mod unix_pty): openpty + tcgetattr to put
# `oam run` on a real terminal and check what setRawMode does to it.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# Windows pseudoconsole e2e (tests/e2e.rs, mod conpty): CreatePseudoConsole +
# an EXTENDED_STARTUPINFO child, so the raw-mode switch is exercised against a
# real console rather than a pipe (a piped stdin never reaches the cancel).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
