[package]
name = "oam_cli"
description = "The oam binary."
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "oam"
path = "src/main.rs"

[features]
default = ["napi"]
# Passthrough for oam_engine's `napi` feature. It is a SEPARATE feature here
# because build.rs keys the exported ABI surface off CARGO_FEATURE_NAPI: a
# build.rs only ever sees its OWN package's features, never a dependency's.
# With it off, no `.def` / `--export-dynamic` link arg is emitted and the
# binary exports no `napi_*` symbol at all.
napi = ["oam_engine/napi"]

[dependencies]
# default-features = false so `--no-default-features` on THIS crate actually
# reaches oam_engine; the `napi` feature above turns it back on.
oam_engine = { workspace = true, default-features = false }
oam_diagnostics = { workspace = true }
oam_loader = { workspace = true }
oam_ts = { workspace = true }
oam_mcp = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Inspector e2e: a CDP-over-WebSocket client that attaches to the spawned
# `oam run --inspect-brk` process and drives the pause/resume handshake.
tokio = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["connect", "handshake"] }
futures-util = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
