[package]
name = "oam_mcp"
description = "MCP server: oam's introspection (check, run, explain, project info) exposed to coding agents. stdio transport; Streamable HTTP arrives with oam_http."
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oam_diagnostics = { workspace = true }
oam_ts = { workspace = true }
serde_json = { workspace = true }

[lints.clippy]
# The crate is `#![forbid(unsafe_code)]`, so the coverage lints are moot --
# but a stray `// Safety:` prose comment still trips this one, and did.
unnecessary_safety_comment = "deny"
