[package]
name = "oam_loader"
description = "Module pipeline: TS strip/transform (oxc), and later the ESM graph, npm resolution, CJS interop, caches."
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oam_diagnostics = { workspace = true }
oxc_allocator = { workspace = true }
oxc_ast = { workspace = true }
oxc_ast_visit = { workspace = true }
oxc_parser = { workspace = true }
oxc_span = { workspace = true }
oxc_semantic = { workspace = true }
oxc_transformer = { workspace = true }
oxc_codegen = { workspace = true }
oxc_diagnostics = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `oam install` — lockfile-driven package installer.
reqwest = { workspace = true }
rustls = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true }

[lints.clippy]
# The crate is `#![forbid(unsafe_code)]`, so the coverage lints are moot --
# but a stray `// Safety:` prose comment still trips this one, and did.
unnecessary_safety_comment = "deny"
