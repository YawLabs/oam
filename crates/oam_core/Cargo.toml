[package]
name = "oam_core"
description = "Engine-agnostic async substrate: tokio runtime, op-completion channel, built-in op futures. v8-free by design."
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oam_diagnostics = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# node:zlib compression backend.
flate2 = { workspace = true }
# HTTP server (hyper rides in-tree via reqwest).
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
# V8 Inspector CDP transport: WebSocket framing + the WS accept hash.
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
sha1 = { workspace = true }
# node:zlib brotli backend (pure-Rust; default features only).
brotli = { workspace = true }
# DNS record-type resolution.
hickory-resolver = { workspace = true }
# Base64 decoding for binary fetch request bodies.
base64 = { workspace = true }
# TLS client/server for node:tls and node:https.
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }
rustls-pemfile = { workspace = true }

# Windows extra-fd stdio: raw CreateProcessW + lpReserved2 CRT fd-table so a
# child (Chromium --remote-debugging-pipe) gets numbered fds 3/4 for CDP. std
# Command only wires stdin/stdout/stderr; this is the libuv mechanism. cfg-
# gated so non-Windows builds never compile or link it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

# Unix extra-fd stdio (child_unix.rs): the signal-number table, the pollfd for
# the blocking pipe read, and the async-signal-safe `dup2` inside `pre_exec`.
# cfg-gated so non-Unix builds never pull it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Safe, ownership-typed wrappers over the POSIX syscalls this crate used to
# call through raw `libc` FFI (statfs/statvfs, fchown/chown/chownat,
# futimens/utimensat, chmodat, dup/fcntl/close/read/write, kill). Every one of
# those was an `unsafe` block whose obligation is now discharged inside a
# maintained, audited crate instead of here -- see AI-POLICY.md gate 5.
#
# NOT new supply chain: rustix 1.1.4 is already in Cargo.lock via tar -> xattr.
# This is a new dependency EDGE onto a crate that was already being compiled.
#
# MUST stay cfg(unix): on Windows rustix ships only its Winsock surface, so
# none of the fs/process APIs used here exist there.
#
# Errors arrive as `rustix::io::Errno`, NOT via `std::io::Error::last_os_error`
# -- on Linux rustix defaults to the `linux_raw` backend, which issues raw
# syscalls and never touches libc's thread-local `errno`. Every call site
# therefore routes through `io_from_errno` (lib.rs), which is the single point
# where the raw number becomes the `std::io::Error` that `node_error_code` /
# `node_errno` read to build Node's `errno`/`syscall`/`path` triple.
rustix = { version = "1.1.4", features = ["event", "fs", "pipe", "process"] }

# io_uring FS fast path: Linux-only async file I/O via io_uring, opt-in and
# runtime-probed (see docs/design/io_uring.md). cfg-gated so non-Linux builds
# never compile or link it -- they use the existing tokio::fs path.
[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = "0.5"
# Raw io_uring -- used only to probe availability (IoUring::new) without the
# panic tokio_uring::start would raise on an unsupported kernel / seccomp.
io-uring = "0.6"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
