[package]
name = "oam_core"
description = "Engine-agnostic async substrate: tokio runtime, op-completion channel, built-in op futures. v8-free by design."
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oam_diagnostics = { workspace = true }
tokio = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# node:zlib compression backend.
flate2 = { workspace = true }
# HTTP server, and since #143 the client half: the fetch transport is
# hyper-util's pooled legacy client with oam's own connector, its env-proxy
# Matcher and CONNECT tunnel (reqwest is oam_loader's install client only; it
# enables every one of these features on the same versions).
hyper = { workspace = true, features = ["client"] }
hyper-util = { workspace = true, features = ["client", "client-legacy", "client-proxy", "http1", "http2"] }
h2 = { workspace = true }
tower-service = { workspace = true }
rustls-platform-verifier = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
# http_head: upgrade request heads, parsed with the parser hyper uses.
httparse = { workspace = true }
# http_client (#143): request preparation and the redirect step.
url = { workspace = true }
http = { workspace = true }
percent-encoding = { workspace = true }
# http_client response decoding: brotli's decoder stream, driven directly.
brotli-decompressor = { workspace = true }
# http_client gzip/deflate: miniz_oxide's core inflate (flate2's backend).
miniz_oxide = { workspace = true }
# V8 Inspector CDP transport: WebSocket framing + the WS accept hash.
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
sha1 = { workspace = true }
# node:zlib brotli backend (pure-Rust; default features only).
brotli = { workspace = true }
# DNS record-type resolution.
hickory-resolver = { workspace = true }
# Base64 decoding for binary fetch request bodies.
base64 = { workspace = true }
# TLS server keys (tls/keys.rs): encrypted PEM keys and PKCS#12 bundles, as
# Node's createSecureContext opens them -- PBES2 (PBKDF2 or scrypt, AES-CBC),
# OpenSSL's legacy EVP_BytesToKey (MD5), PKCS#12's KDF and MAC (SHA-1/2).
#
# NOT new supply chain: all seven already compile in the graph as oam_engine's
# node:crypto backends, on the same versions and features. New dependency
# EDGES onto crates already being built.
aes = { workspace = true }
cbc = { workspace = true }
pbkdf2 = { workspace = true }
scrypt = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
md-5 = { workspace = true }
# Triple-DES for the same keys and bundles (Node reads DES-EDE3-CBC legacy
# PEM keys, PBES2 des-ede3-cbc and PKCS#12's 3DES PBEs). A NEW crate in the
# graph (RustCrypto `des`, MIT OR Apache-2.0), whose only dependency is
# `cipher` 0.4, already built for aes and cbc.
des = { workspace = true }
# TLS client/server for node:tls and node:https.
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }
rustls-pemfile = { workspace = true }
# Node's certificate verdicts (tls.rs): x509-parser reads validity,
# issuer/subject and subjectAltName off the peer chain to name a refusal the
# way OpenSSL does and to run Node's own hostname check; rustls-webpki is
# named only to recognise its `CaUsedAsEndEntity` behind rustls's
# `CertificateError::Other`.
#
# NOT new supply chain: both already compile in the graph -- x509-parser via
# oam_engine (node:crypto's X509Certificate), rustls-webpki 0.103 via rustls
# itself, on the same version and the same features (ring, std) rustls
# enables. These are new dependency EDGES onto crates already being built.
x509-parser = { workspace = true }
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
# The outbound connector net.connect and tls.connect share (net_connect.rs):
# one socket per attempt, created, bound and connected by hand so a failure
# connect(2) reports synchronously can be told from one that arrives later
# (node words the two differently) and so Windows can pre-bind a dual-stack
# IPv6 socket before connecting, as libuv does.
#
# NOT new supply chain: socket2 0.6.4 already compiles in the graph via tokio
# and hyper-util. A new dependency EDGE onto a crate already being built.
# "all" for the fetch connector's keepalive probe count and TCP_USER_TIMEOUT;
# hyper-util already builds socket2 with it.
socket2 = { version = "0.6", features = ["all"] }

# Windows extra-fd stdio: raw CreateProcessW + lpReserved2 CRT fd-table so a
# child (Chromium --remote-debugging-pipe) gets numbered fds 3/4 for CDP. std
# Command only wires stdin/stdout/stderr; this is the libuv mechanism. cfg-
# gated so non-Windows builds never compile or link it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    # Declarations only: the WSA* error constants node_error_code's libuv
    # table matches on.
    "Win32_Networking_WinSock",
] }

# Unix extra-fd stdio (child_unix.rs): the signal-number table, the pollfd for
# the blocking pipe read, and the async-signal-safe `dup2` inside `pre_exec`.
# cfg-gated so non-Unix builds never pull it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Safe, ownership-typed wrappers over the POSIX syscalls this crate used to
# call through raw `libc` FFI (statfs/statvfs, fchown/chown/chownat,
# futimens/utimensat, chmodat, dup/fcntl/close/read/write, kill). Every one of
# those was an `unsafe` block whose obligation is now discharged inside a
# maintained, audited crate instead of here -- see AI-POLICY.md gate 5.
#
# NOT new supply chain: rustix 1.1.4 is already in Cargo.lock via tar -> xattr.
# This is a new dependency EDGE onto a crate that was already being compiled.
#
# MUST stay cfg(unix): on Windows rustix ships only its Winsock surface, so
# none of the fs/process APIs used here exist there.
#
# Errors arrive as `rustix::io::Errno`, NOT via `std::io::Error::last_os_error`
# -- on Linux rustix defaults to the `linux_raw` backend, which issues raw
# syscalls and never touches libc's thread-local `errno`. Every call site
# therefore routes through `io_from_errno` (lib.rs), which is the single point
# where the raw number becomes the `std::io::Error` that `node_error_code` /
# `node_errno` read to build Node's `errno`/`syscall`/`path` triple.
rustix = { version = "1.1.4", features = ["event", "fs", "pipe", "process"] }

# io_uring FS fast path: Linux-only async file I/O via io_uring, opt-in and
# runtime-probed (see docs/design/io_uring.md). cfg-gated so non-Linux builds
# never compile or link it -- they use the existing tokio::fs path.
[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = "0.5"
# Raw io_uring -- used only to probe availability (IoUring::new) without the
# panic tokio_uring::start would raise on an unsupported kernel / seccomp.
io-uring = "0.6"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
