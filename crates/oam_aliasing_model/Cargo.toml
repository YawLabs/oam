[package]
name = "oam_aliasing_model"
description = "Miri-checkable models of napi.rs's raw-pointer disciplines. Zero dependencies on purpose -- see src/lib.rs."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# NO dependencies, and none may be added. Two reasons, both load-bearing:
#   1. cargo-miri does not support the argfile cargo switches to on long
#      command lines, so a crate with a real dependency graph cannot be built
#      under miri on Windows at all.
#   2. Miri cannot execute foreign functions, so anything reaching V8 is out.
[dependencies]

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
missing_safety_doc = "deny"

[lints.cargo]
# A dependency no target of this crate uses fails the gate on every leg.
# `-D warnings` after `--` reaches rustc and clippy only; cargo's own lints
# are not rustc lints, so warn-by-default `unused_dependencies` (cargo 1.100)
# would otherwise only print. Per-package, not `[workspace.lints]`: every
# member has its own `[lints.clippy]`, which `lints.workspace = true` cannot
# be combined with. vendor/ crates are excluded from the workspace and keep
# their upstream manifests. Measured limits on 1.100: dev-dependencies are
# not checked, and a direct dependency that is also reachable through another
# dependency is not reported.
unused_dependencies = "deny"
